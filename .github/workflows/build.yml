name: Build VenusBar

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Universal macOS app
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Official actions/checkout v7.0.1, verified against its release commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build, sign ad hoc, and run offline self-checks
        run: zsh scripts/build_venusbar.sh

      - name: Verify universal binary and archive
        run: |
          xcrun lipo build/VenusBar.app/Contents/MacOS/VenusBar -verify_arch arm64 x86_64
          unzip -tq build/VenusBar.zip

      - name: Create SHA-256 checksum
        working-directory: build
        run: shasum -a 256 VenusBar.zip > SHA256SUMS.txt

      # Official actions/upload-artifact v7.0.2, verified release commit.
      - name: Upload ZIP and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: VenusBar-universal
          path: |
            build/VenusBar.zip
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

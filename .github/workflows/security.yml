name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify scanner and scan complete Git history
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          scanner_dir=$(mktemp -d "$RUNNER_TEMP/venusbar-gitleaks.XXXXXX")
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scanner_dir/gitleaks.tar.gz"
          printf '%s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' \
            | (cd "$scanner_dir" && sha256sum --check -)
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
          printf '[extend]\nuseDefault = true\n' > "$scanner_dir/config.toml"
          touch "$scanner_dir/.gitleaksignore"
          "$scanner_dir/gitleaks" git . --log-opts='--all' --redact=100 --no-banner \
            --config "$scanner_dir/config.toml" --gitleaks-ignore-path "$scanner_dir/.gitleaksignore" \
            --ignore-gitleaks-allow
